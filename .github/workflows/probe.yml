name: Probe DLT history and official cross-check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'
      - 'lib/**'
      - 'scripts/probe.js'
      - 'test/**'
      - 'data/draws.json'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/source.test.js
      - run: node scripts/probe.js
