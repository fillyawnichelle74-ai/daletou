name: Update DLT and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'lib/**'
      - 'scripts/**'
      - 'site/**'
      - 'test/**'
      - 'package.json'
      - 'README.md'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dlt-update-and-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: node --test test/*.test.js
      - name: Update validated history and daily tickets
        run: node scripts/update.js
      - name: Build matching static data
        run: node scripts/build.js
      - name: Commit successful data update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated DLT data'
            git push origin HEAD:"$DEFAULT_BRANCH"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Configure Pages
        if: ${{ github.event.repository.private == false }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ github.event.repository.private == false }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: update
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        if: ${{ github.event.repository.private == false }}
        id: deployment
        uses: actions/deploy-pages@v4
